name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventriva-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ventriva-audit/.nvmrc
          cache: npm
          cache-dependency-path: ventriva-audit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.183.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
      - run: npm run build
